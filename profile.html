<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Eater&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div id="container">
        <a href="/index2.html"><i class="bi bi-arrow-left" id="back"></i></a>
        <div class="card">
            <img onclick="chooseImage()" id="person" src="/profile.png" alt="">
            <input type="file" id="imageInput" accept="image/*" hidden>
             <h2 id="username">Username : ___________</h2>
             <h2 id="age">Age : _______________</h2>
            <form id="profileForm" hidden>
            <input type="text" id="usernameInput" placeholder="Username" maxlength="20" autocomplete="off" required>
            <input type="number" id="ageInput" placeholder="Age" min="1" max="120" required>
            <button type="submit" id="formSave">Done</button>
            </form>
            <button id="profile">Save Profile</button>
        </div>
    </div>
    <script src="/Game.js"></script>
</body>
</html>
